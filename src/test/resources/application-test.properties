# In-memory H2 database, discarded when tests finish
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA recreates the schema on every run
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Fixed JWT secret for tests only - NEVER use this in production
api.security.token.secret=test-secret-key-only-for-tests